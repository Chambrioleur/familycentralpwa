<script>
  // iOS/PWA: 100dvh ist im Standalone-Modus und bei ein-/ausblendender
  // Tastatur unzuverlässig. Deshalb die tatsächlich sichtbare Höhe aktiv
  // messen und als CSS-Variable bereitstellen.
  //
  // Wichtig für den "Zum Home-Bildschirm"-Modus von Safari: beim Kaltstart
  // liefert iOS die Fensterhöhe zunächst FALSCH (zu klein) und korrigiert
  // sie erst kurz danach — ohne ein resize-Ereignis auszulösen. Deshalb
  // wird in den ersten Sekunden mehrfach nachgemessen. Außerdem ist
  // window.innerHeight hier die verlässlichere Quelle als visualViewport
  // (letzterer rechnet im Standalone-Start teils die Safe-Areas falsch ein).
  (function () {
    function setAppHeight() {
      var h = window.innerHeight;
      document.documentElement.style.setProperty("--app-height", h + "px");
    }
    function measureRepeatedly() {
      setAppHeight();
      [100, 300, 600, 1000, 2000].forEach(function (ms) {
        setTimeout(setAppHeight, ms);
      });
    }
    measureRepeatedly();
    window.addEventListener("load", measureRepeatedly);
    window.addEventListener("resize", setAppHeight);
    window.addEventListener("orientationchange", measureRepeatedly);
    window.addEventListener("pageshow", measureRepeatedly);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) measureRepeatedly();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", setAppHeight);
    }
  })();

  // iOS-Standalone-Apps (Home-Bildschirm) halten teils sehr hartnäckig an
  // alten Versionen fest, selbst nach "Website-Daten löschen". Deshalb hier
  // aktiv nach Updates suchen, statt nur passiv auf HTTP-Caching zu vertrauen.
  (function () {
    // Statt beim Erkennen einer neuen Version sofort neu zu laden (Risiko:
    // Reload mitten in einer Eingabe reisst unfertige Formulare weg), wird
    // nur ein Flag gesetzt + Event gefeuert. Die React-App zeigt daraufhin
    // einen Banner mit "Jetzt aktualisieren"-Button — der Nutzer entscheidet.
    function notifyUpdateAvailable() {
      window.__fzUpdateAvailable = true;
      window.dispatchEvent(new CustomEvent("fz-update-available"));
    }

    // 1) Service Worker registrieren, unabhängig von Push-Benachrichtigungen —
    //    er übernimmt jetzt auch das Cachen der CDN-Bibliotheken (React,
    //    Supabase-JS, lucide-react), das soll für alle greifen, nicht nur
    //    für Leute, die Push aktiviert haben. Danach auf neue Version prüfen.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          reg.update();
          reg.addEventListener("updatefound", function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener("statechange", function () {
              if (nw.state === "installed" && navigator.serviceWorker.controller) {
                notifyUpdateAvailable();
              }
            });
          });
        });
      });
    }

    // 2) Eigene Versionsprüfung unabhängig vom Service Worker: holt die
    //    aktuelle index.html unter Umgehung jeglichen Caches und vergleicht
    //    die Build-Kennung.
    var metaTag = document.querySelector('meta[name="app-build"]');
    var currentBuild = metaTag ? metaTag.content : null;
    function checkForNewVersion() {
      if (!currentBuild) return;
      fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.text(); })
        .then(function (html) {
          var m = html.match(/name="app-build" content="([^"]+)"/);
          if (m && m[1] !== currentBuild) notifyUpdateAvailable();
        })
        .catch(function () {});
    }
    checkForNewVersion();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) checkForNewVersion();
    });
  })();
</script>

function t(s) {
  if (LANG === "de" || typeof s !== "string") return s;
  const dict = TRANSLATIONS[LANG];
  return dict && dict[s] !== undefined ? dict[s] : s;
}

// Für Sätze mit eingebetteten Werten (Zahlen, Namen, Daten): key ist der
// deutsche Satz mit {platzhaltern}, vars liefert die Werte. Pluralformen
// werden vom Aufrufer als fertiger String übergeben (z.B. vars.s = "n"
// oder ""), nicht von tf() selbst entschieden — Deutsch und Englisch
// pluralisieren unterschiedlich.
function tf(key, vars) {
  const tmpl = t(key);
  return tmpl.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : ""));
}

// Kurze Wochentagsnamen aus der Locale ableiten, montagsbasiert.
// 1.–7. Januar 2024 war Montag bis Sonntag.
function buildWeekdays() {
  const f = new Intl.DateTimeFormat(locale(), { weekday: "short" });
  return [1, 2, 3, 4, 5, 6, 7].map((day) => f.format(new Date(2024, 0, day)));
}

// Setzt die Sprache und alles, was daraus abgeleitet ist. WOCHENTAGE ist
// absichtlich mit let deklariert, damit die vielen Verwendungsstellen
// unverändert bleiben können.
function applyLang(l) {
  LANG = SPRACHEN[l] ? l : "de";
  WOCHENTAGE = buildWeekdays();
  WOCHENTAGE_SCHULE = WOCHENTAGE.slice(0, 5);
  document.documentElement.lang = LANG;
}
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

function useViewportWidth() {
  const [width, setWidth] = useState(window.innerWidth);
  useEffect(() => {
    const onResize = () => setWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("orientationchange", onResize);
    };
  }, []);
  return width;
}

function generateLoginEmail(name) {
  const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "") || "person";
  const rand = Math.random().toString(36).slice(2, 6);
  return `${slug}.${rand}@familienzentrale.local`;
}

function useAutoLock(onLock) {
  const timer = useRef(null);
  const reset = useCallback(() => {
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(onLock, AUTO_LOCK_MS);
  }, [onLock]);
  useEffect(() => {
    const events = ["mousemove", "touchstart", "keydown", "click"];
    events.forEach((e) => window.addEventListener(e, reset));
    reset();
    return () => { events.forEach((e) => window.removeEventListener(e, reset)); if (timer.current) clearTimeout(timer.current); };
  }, [reset]);
}

// Resizes an image in the browser (Canvas) before upload, instead of e.g.
// uploading an unmodified multi-MB iPhone photo — that would otherwise
// slow down every load of the profile picture. Non-image files (or
// browsers without Canvas support) are passed through unchanged.
async function resizeImageFile(file, maxDimension, quality) {
  if (!file.type.startsWith("image/") || file.type === "image/svg+xml") return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
    if (scale >= 1) { bitmap.close?.(); return file; }
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const ctx = canvas.getContext("2d");

function wiederholungLabel() {
  return { taeglich: t("Täglich"), woechentlich: t("Wöchentlich"), monatlich: t("Monatlich"), jaehrlich: t("Jährlich") };
}

function nextOccurrence(dateStr, wiederholung, intervallTage) {
  const d = dateStr ? new Date(dateStr) : new Date();
  if (wiederholung === "taeglich") d.setDate(d.getDate() + 1);
  else if (wiederholung === "woechentlich") d.setDate(d.getDate() + 7);
  else if (wiederholung === "monatlich") d.setMonth(d.getMonth() + 1);
  else if (wiederholung === "jaehrlich") d.setFullYear(d.getFullYear() + 1);
  else if (wiederholung === "eigen") d.setDate(d.getDate() + (Number(intervallTage) || 1));
  return d;
}

function taskWiederholungLabel() {
  return { taeglich: t("Täglich"), woechentlich: t("Wöchentlich"), monatlich: t("Monatlich"), jaehrlich: t("Jährlich"), eigen: t("Eigener Rhythmus") };
}

function RemindersModule({ theme, reminders, onAdd, onToggle, onDelete, onUpdate }) {

  const [wiederholung, setWiederholung] = useState("");

  const [showForm, setShowForm] = useState(false);
  const submit = async () => {
    if (!titel.trim()) return;
    await onAdd({ titel: titel.trim(), faelligkeit: faelligkeit || null, typ, wiederholung: wiederholung || null });
    setTitel(""); setFaelligkeit(""); setShowForm(false);
  };
  const complete = async (r) => {
    if (r.wiederholung) {
      await onUpdate(r.id, { faelligkeit: isoDate(nextOccurrence(r.faelligkeit, r.wiederholung)) });
    } else {
      await onToggle(r.id, "erledigt");
    }
  };
  const offen = reminders.filter((r) => r.status === "offen").sort((a, b) => new Date(a.faelligkeit || 0) - new Date(b.faelligkeit || 0));
  const daysUntil = (d) => Math.round((new Date(d) - new Date()) / 86400000);

  return h("div", { style: { maxWidth: 720, margin: "0 auto", width: "100%" } },
    h(PageHead, {
      theme, title: t("Erinnerungen"), subtitle: t("Fristen im Blick behalten."),

      h(Dropdown, { theme, value: typ, onChange: setTyp, style: { width: 130 }, options: [{ value: "allgemein", label: t("Allgemein") }, { value: "frist", label: t("Frist") }, { value: "geburtstag", label: t("Geburtstag") }] }),
      h(LabeledDate, { theme, label: t("Fällig am (optional)"), value: faelligkeit, onChange: (e) => setFaelligkeit(e.target.value), style: { padding: "9px 10px", fontSize: 14 } }),
      h(Dropdown, { theme, value: wiederholung, onChange: setWiederholung, style: { width: 130 }, options: [{ value: "", label: t("Einmalig") }, ...Object.entries(wiederholungLabel()).map(([k, v]) => ({ value: k, label: v }))] }),
      h("button", { onClick: submit, style: { padding: "9px 18px", borderRadius: 10, backgroundColor: theme.accent, color: theme.accentForeground, fontWeight: 600, fontSize: 14 } }, t("Speichern"))
    ),
    h("ul", { style: { display: "flex", flexDirection: "column", gap: 10, listStyle: "none", margin: 0, padding: 0 } },
      offen.length === 0 && h(EmptyState, { theme, icon: BellRing, title: t("Keine offenen Erinnerungen."), hint: t("Fristen, die du hinzufügst, erscheinen hier.") }),
      offen.map((r, i) => {
        if (editingId === r.id) {
          return h(ReminderEditRow, { key: r.id, theme, reminder: r, onCancel: () => setEditingId(null), onSave: async (fields) => { await onUpdate(r.id, fields); setEditingId(null); } });
        }
        const tone = toneByIndex(theme, i);
        const days = r.faelligkeit ? daysUntil(r.faelligkeit) : null;
        return h("li", { key: r.id, style: { display: "flex", alignItems: "center", gap: 14, borderRadius: 16, border: `1px solid ${theme.border}`, backgroundColor: theme.surface, padding: 14 } },
          h("span", { style: { display: "flex", width: 44, height: 44, flexShrink: 0, alignItems: "center", justifyContent: "center", borderRadius: 12, backgroundColor: hexA(tone, 0.15) } },
            React.createElement(BellRing, { size: 19, color: tone })
          ),
          h("div", { onClick: () => setEditingId(r.id), style: { minWidth: 0, flex: 1, cursor: "pointer" } },
            h("p", { style: { fontSize: 15, fontWeight: 500, color: theme.text, margin: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, r.titel),
            h("p", { style: { fontSize: 13, color: theme.textMuted, margin: 0 } },
              r.faelligkeit ? new Date(r.faelligkeit).toLocaleDateString(locale(), { day: "numeric", month: "long" }) : r.typ,
              r.wiederholung ? ` · ↻ ${wiederholungLabel()[r.wiederholung]}` : ""
            )
          ),
          days !== null && h("span", { style: { flexShrink: 0, borderRadius: 999, backgroundColor: theme.surfaceAlt, padding: "5px 12px", fontSize: 12, fontWeight: 500, color: theme.textMuted } },
            days < 0 ? t("überfällig") : days === 0 ? t("heute") : (LANG === "de" ? `in ${days} Tag${days === 1 ? "" : "en"}` : `in ${days} day${days === 1 ? "" : "s"}`)
          ),
          h("button", { onClick: () => complete(r), style: { flexShrink: 0, fontSize: 12, color: theme.accent, background: "none" } }, r.wiederholung ? t("Erledigt (↻)") : t("Erledigt")),
          h("button", { onClick: () => requestConfirm(t("Wirklich löschen?"), () => onDelete(r.id)), style: { flexShrink: 0, fontSize: 12, color: theme.textMuted, background: "none" } }, React.createElement(X, { size: 14 }))

function ShoppingModule({ theme, items, lists, activeListId, onSelectList, onCreateList, onDeleteList, onAdd, onToggle, onDelete, onUpdate, suggestions: learnedSuggestions, onLearnSuggestion }) {
  const [titel, setTitel] = useState("");
  const [menge, setMenge] = useState("");
  const [einheit, setEinheit] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [newListName, setNewListName] = useState("");
  const [showNewList, setShowNewList] = useState(false);
  const [showSuggestions, setShowSuggestions] = useState(false);

  // Eigene, dazugelernte Artikel zuerst, dann die feste Grundliste — nach
  // Namen dedupliziert (eigene Einheit gewinnt, falls abweichend).
  const combinedSuggestions = useMemo(() => {
    const own = (learnedSuggestions || []).map((s) => ({ name: s.name, einheit: s.einheit }));
    const ownNames = new Set(own.map((s) => s.name.toLowerCase()));
    const rest = grocerySuggestions().filter((g) => !ownNames.has(g.name.toLowerCase()));
    return [...own, ...rest];
    // LANG als Abhängigkeit: grocerySuggestions() liefert je nach Sprache andere
    // Namen, useMemo würde das ohne diesen Hinweis nicht bemerken (siehe
    // navSections/applyLang weiter oben für den Hintergrund).
  }, [learnedSuggestions, LANG]);

  const suggestions = titel.trim().length >= 2
    ? combinedSuggestions.filter((g) => g.name.toLowerCase().startsWith(titel.trim().toLowerCase())).slice(0, 6)
    : [];

  const pickSuggestion = (s) => {
    setTitel(s.name); setEinheit(s.einheit || ""); setShowSuggestions(false);
  };

  const listItems = items.filter((i) => i.liste_id === activeListId);
  const submit = async () => {
    if (!titel.trim() || !activeListId) return;
    await onAdd({ titel: titel.trim(), menge: menge || null, einheit: einheit || null, liste_id: activeListId });
    onLearnSuggestion?.(titel.trim(), einheit || null);
    setTitel(""); setMenge(""); setEinheit(""); setShowSuggestions(false);
  };
  const submitNewList = async () => {
    if (!newListName.trim()) return;
    await onCreateList(newListName.trim());
    setNewListName(""); setShowNewList(false);
  };
  const offen = listItems.filter((i) => !i.erledigt);
  const erledigt = listItems.filter((i) => i.erledigt);

  return h("div", { style: { maxWidth: 640, margin: "0 auto", width: "100%" } },
    h(PageHead, {
      theme, title: t("Einkauf"), subtitle: tf("{done} von {total} erledigt", { done: erledigt.length, total: listItems.length }),
      action: h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", position: "relative" } },
        h("div", { style: { position: "relative" } },
          h("input", {
            value: titel,
            onChange: (e) => { setTitel(e.target.value); setShowSuggestions(true); },
            onFocus: () => setShowSuggestions(true),
            onBlur: () => setTimeout(() => setShowSuggestions(false), 150),
            placeholder: t("Artikel…"), style: { padding: "9px 12px", borderRadius: 10, border: `1px solid ${theme.border}`, fontSize: 14, width: 180 },
          }),
          showSuggestions && suggestions.length > 0 && h("div", {
            style: { position: "absolute", top: "100%", left: 0, right: 0, marginTop: 4, backgroundColor: theme.surface, border: `1px solid ${theme.border}`, borderRadius: 10, overflow: "hidden", zIndex: 10, boxShadow: "0 8px 20px rgba(0,0,0,0.15)" },
          },
            suggestions.map((s) => h("button", {
              key: s.name, onMouseDown: (e) => e.preventDefault(), onClick: () => pickSuggestion(s),
              style: { display: "flex", justifyContent: "space-between", width: "100%", padding: "8px 12px", fontSize: 13, color: theme.text, background: "none", textAlign: "left" },
            }, s.name, h("span", { style: { color: theme.textMuted, fontSize: 12 } }, s.einheit)))
          )
        ),
        h("input", { value: menge, onChange: (e) => setMenge(e.target.value), placeholder: t("Menge"), style: { backgroundColor: theme.surface, color: theme.text, width: 80, padding: "9px 12px", borderRadius: 10, border: `1px solid ${theme.border}`, fontSize: 14 } }),
        h("input", { value: einheit, onChange: (e) => setEinheit(e.target.value), placeholder: t("Einheit"), style: { backgroundColor: theme.surface, color: theme.text, width: 90, padding: "9px 12px", borderRadius: 10, border: `1px solid ${theme.border}`, fontSize: 14 } }),
        h(AddButton, { theme, label: t("Artikel"), onClick: submit })
      ),
    }),
    h("div", { style: { marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" } },
      lists.map((l) => h("button", {
        key: l.id, onClick: () => onSelectList(l.id),
        style: { borderRadius: 999, border: `1px solid ${activeListId === l.id ? theme.accent : theme.border}`, backgroundColor: activeListId === l.id ? hexA(theme.accent, 0.15) : theme.surface, color: activeListId === l.id ? theme.accent : theme.textMuted, padding: "7px 16px", fontSize: 13, fontWeight: 500 },
      }, l.name)),
      showNewList
        ? h("div", { style: { display: "flex", gap: 4 } },
            h("input", { value: newListName, onChange: (e) => setNewListName(e.target.value), placeholder: t("Listenname"), autoFocus: true, style: { backgroundColor: theme.surface, color: theme.text, padding: "6px 10px", borderRadius: 999, border: `1px solid ${theme.border}`, fontSize: 13, width: 130 } }),
            h("button", { onClick: submitNewList, style: { fontSize: 12, color: theme.accent, background: "none", fontWeight: 600 } }, "OK")
          )
        : h("button", { onClick: () => setShowNewList(true), style: { borderRadius: 999, border: `1px dashed ${theme.border}`, color: theme.textMuted, padding: "7px 14px", fontSize: 13 } }, "+ Liste")
    ),
    activeListId && lists.length > 1 && h("button", {
      onClick: () => requestConfirm(tf('Liste "{name}" wirklich löschen?', { name: lists.find(l=>l.id===activeListId)?.name }), () => onDeleteList(activeListId)),
      style: { marginBottom: 12, fontSize: 12, color: theme.textMuted, background: "none" },
    }, t("Diese Liste löschen")),
    h("section", { style: { borderRadius: 16, border: `1px solid ${theme.border}`, backgroundColor: theme.surface, padding: 20 } },
      listItems.length === 0 && h(EmptyState, { theme, icon: ShoppingCart, title: t("Liste ist leer."), hint: t("Füge oben einen Artikel hinzu.") }),
      h("ul", { style: { display: "flex", flexDirection: "column", listStyle: "none", margin: 0, padding: 0 } },
        [...offen, ...erledigt].map((item, i) => editingId === item.id
          ? h(ShoppingEditRow, { key: item.id, theme, item, onCancel: () => setEditingId(null), onSave: async (fields) => { await onUpdate(item.id, fields); onLearnSuggestion?.(fields.titel, fields.einheit); setEditingId(null); } })
          : h("li", { key: item.id, style: { borderTop: i > 0 ? `1px solid ${theme.border}99` : "none" } },
              h("div", { style: { display: "flex", alignItems: "center", gap: 12, padding: "10px 0" } },
                h("button", { onClick: () => onToggle(item.id, !item.erledigt), style: {
                  display: "flex", width: 20, height: 20, flexShrink: 0, alignItems: "center", justifyContent: "center", borderRadius: 999,
                  border: `1px solid ${item.erledigt ? theme.accent : theme.border}`, backgroundColor: item.erledigt ? theme.accent : "transparent", color: theme.accentForeground,
                } }, item.erledigt && React.createElement(Check, { size: 12 })),
                h("span", { onClick: () => setEditingId(item.id), style: { flex: 1, fontSize: 15, color: item.erledigt ? theme.textMuted : theme.text, textDecoration: item.erledigt ? "line-through" : "none", cursor: "pointer" } }, item.titel),
                (item.menge || item.einheit) && h("span", { style: { fontSize: 13, color: theme.textMuted, fontVariantNumeric: "tabular-nums" } }, [item.menge, item.einheit].filter(Boolean).join(" ")),
                h("button", { onClick: () => requestConfirm(t("Wirklich löschen?"), () => onDelete(item.id)), style: { fontSize: 12, color: theme.textMuted, background: "none" } }, React.createElement(X, { size: 14 }))
              )
            ))
      )
    )
  );
}

function parseCSVLine(line, delim) {
  const result = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
      else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delim) { result.push(cur); cur = ""; }
      else cur += c;
    }
  }
  result.push(cur);
  return result.map((s) => s.trim());
}

function parseGermanNumber(s) {
  if (!s) return NaN;
  const cleaned = s.replace(/[€\s]/g, "").replace(/\.(?=\d{3}(?:\D|$))/g, "").replace(",", ".");
  return parseFloat(cleaned);
}

function parseFlexibleDate(s) {
  if (!s) return null;
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = "20" + y;
    return `${y}-${mo.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  return null;
}

function guessColumn(headers, candidates) {
  const lower = headers.map((h) => h.toLowerCase());
  for (const cand of candidates) {
    const idx = lower.findIndex((h) => h.includes(cand));
    if (idx !== -1) return idx;
  }
  return -1;
}

function parseBankCSV(text) {
  // BOM entfernen (DKB & andere Banken liefern UTF-8-Dateien oft mit BOM aus)
  text = text.replace(/^\uFEFF/, "");
  const allLines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (allLines.length < 2) return { headers: [], rows: [] };

  // Manche Banken (z.B. DKB) setzen vor die eigentliche Tabelle noch ein
  // paar Meta-Zeilen (Kontoname, Zeitraum, Kontostand). Wir suchen die
  // Zeile, die wie eine echte Kopfzeile aussieht, statt blind Zeile 1 zu
  // nehmen.
  const headerKeywords = ["buchungsdatum", "wertstellung", "betrag", "datum", "umsatz", "iban", "empfänger", "zahlungsempfänger"];
  let headerLineIdx = 0;
  for (let i = 0; i < Math.min(allLines.length, 15); i++) {
    const lower = allLines[i].toLowerCase();
    const hits = headerKeywords.filter((k) => lower.includes(k)).length;
    if (hits >= 2) { headerLineIdx = i; break; }
  }

  const headerLine = allLines[headerLineIdx];
  const delim = (headerLine.match(/;/g) || []).length >= (headerLine.match(/,/g) || []).length ? ";" : ",";
  const headers = parseCSVLine(headerLine, delim);
  const rows = allLines.slice(headerLineIdx + 1).map((l) => parseCSVLine(l, delim)).filter((r) => r.length === headers.length);
  return { headers, rows, delim };
}



function PieChart({ theme, data, size = 160 }) {
  // data: [{ label, value, color }]
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total <= 0) return null;
  const r = size / 2;
  let angle = -90;
  const slices = data.map((d) => {
    const frac = d.value / total;
    const startAngle = angle;
    const endAngle = angle + frac * 360;
    angle = endAngle;
    const toXY = (a) => [r + r * Math.cos((a * Math.PI) / 180), r + r * Math.sin((a * Math.PI) / 180)];
    const [x1, y1] = toXY(startAngle);
    const [x2, y2] = toXY(endAngle);
    const largeArc = endAngle - startAngle > 180 ? 1 : 0;
    const path = frac >= 0.999
      ? `M ${r} 0 A ${r} ${r} 0 1 1 ${r - 0.01} 0 Z`
      : `M ${r} ${r} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    return { path, color: d.color, label: d.label, value: d.value, pct: Math.round(frac * 100) };
  });
  return h("svg", { viewBox: `0 0 ${size} ${size}`, width: size, height: size },
    slices.map((s, i) => h("path", { key: i, d: s.path, fill: s.color, stroke: theme.surface, strokeWidth: 1.5 }))
  );
}

// ── Haushaltsplan-Helfer ────────────────────────────────────────────
// Zuweisungen einer Aufgabe, sortiert nach Rotations-Reihenfolge.
function householdAssigneesFor(taskId, allAssignees) {
  return allAssignees.filter((a) => a.task_id === taskId).sort((a, b) => a.rotation_order - b.rotation_order);
}
// "Wer ist diese Woche dran" — bei nur einer zugewiesenen Person immer
// dieselbe, bei mehreren rotiert es wochenweise durch (deterministisch,
// haengt nur vom Wochen-Index von "forDate" ab, nicht vom Aufrufzeitpunkt).
function householdCurrentAssignee(taskId, allAssignees, forDate) {
  const list = householdAssigneesFor(taskId, allAssignees);
  if (list.length === 0) return null;
  return list[weekIndex(forDate) % list.length].member_id;
}
function householdIsDueOn(task, date) {
  if (task.rhythmus === "taeglich") return true;
  const weekday = ((date.getDay() + 6) % 7) + 1; // 1=Mo..7=So
  return task.wochentag === weekday;
}
// Aufeinanderfolgende Tage rueckwaerts ab "fromDate", an denen die Person
// ALLE ihr an dem Tag zugewiesenen Aufgaben erledigt hat. Tage ohne
// zugewiesene Aufgaben zaehlen weder positiv noch brechen sie die Serie ab.
function householdStreak(memberId, tasks, allAssignees, completions, fromDate) {
  let streak = 0;
  let cursor = new Date(fromDate);
  cursor.setHours(0, 0, 0, 0);
  for (let i = 0; i < 365; i++) {
    const dISO = isoDate(cursor);
    const due = tasks.filter((task) => householdIsDueOn(task, cursor) && householdCurrentAssignee(task.id, allAssignees, cursor) === memberId);
    if (due.length === 0) { cursor = addDays(cursor, -1); continue; }
    const allDone = due.every((task) => completions.some((c) => c.task_id === task.id && c.datum === dISO && c.member_id === memberId));
    if (!allDone) break;
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}

// Dict-Schlüssel, erst beim Rendern/Auswählen mit t() übersetzt, damit ein
// Sprachwechsel die Liste live aktualisiert (kein Modul-weiter t()-Aufruf).

function HaushaltsplanModule({ theme, members, activeMember, tasks, assignees, completions, canEditOthers, onCreateTask, onDeleteTask, onToggleCompletion, suggestions, onSaveSuggestion, onDeleteSuggestion }) {
  const [showForm, setShowForm] = useState(false);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayISO = isoDate(today);
  const monday = startOfWeek(today);
  const memberById = (id) => members.find((m) => m.id === id);
  const isDone = (taskId, dISO, memberId) => completions.some((c) => c.task_id === taskId && c.datum === dISO && c.member_id === memberId);
  const canToggleFor = (assigneeId) => canEditOthers || assigneeId === activeMember?.id;

  const dailyTasks = tasks.filter((t) => t.rhythmus === "taeglich");
  const weekColumns = WOCHENTAGE.map((label, wIdx) => {
    const colDate = addDays(monday, wIdx);
    const colTasks = tasks.filter((t) => t.rhythmus === "woechentlich" && t.wochentag === wIdx + 1);
    return { label, date: colDate, isToday: isoDate(colDate) === todayISO, tasks: colTasks };
  });

  // Heutiger Fortschritt + Streak pro Person, die aktuell mind. eine
  // Aufgabe zugewiesen hat (unabhaengig von Rotation).
  const assignedMemberIds = [...new Set(assignees.map((a) => a.member_id))];
  const progressByMember = assignedMemberIds.map((id) => {
    const dueToday = tasks.filter((task) => householdIsDueOn(task, today) && householdCurrentAssignee(task.id, assignees, today) === id);
    const doneToday = dueToday.filter((task) => isDone(task.id, todayISO, id)).length;
    const streak = householdStreak(id, tasks, assignees, completions, addDays(today, -1));
    return { member: memberById(id), due: dueToday.length, done: doneToday, streak };
  }).filter((p) => p.member);

  return h("div", { style: { maxWidth: 900, margin: "0 auto", width: "100%" } },
    h(PageHead, {
      theme, title: t("Haushaltsplan"), subtitle: t("Wer macht was im Haushalt – und wann."),
      action: h(AddButton, { theme, label: t("Aufgabe"), onClick: () => setShowForm(true) }),
    }),
    showForm && h("div", { style: { marginBottom: 16 } }, h(HouseholdTaskForm, {
      theme, members, suggestions, canManageSuggestions: canEditOthers,
      onCreate: async (payload) => { await onCreateTask(payload); setShowForm(false); },
      onCancel: () => setShowForm(false),
      onSaveSuggestion, onDeleteSuggestion,
    })),
    progressByMember.length > 0 && h("div", { style: { display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 16 } },
      progressByMember.map((p) => h("div", { key: p.member.id, style: { display: "flex", alignItems: "center", gap: 8, borderRadius: 12, border: `1px solid ${theme.border}`, backgroundColor: theme.surface, padding: "8px 12px" } },
        h("span", { style: { width: 26, height: 26, borderRadius: "50%", backgroundColor: p.member.farbe, color: "#fff", fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } }, p.member.name[0]),
        h("div", null,
          h("p", { style: { fontSize: 12, fontWeight: 600, color: theme.text, margin: 0 } }, p.member.name),
          h("p", { style: { fontSize: 11, color: theme.textMuted, margin: 0 } }, tf("Heute {done}/{total}", { done: p.done, total: p.due }) + (p.streak > 0 ? " · 🔥 " + tf("{n} Tage in Folge", { n: p.streak }) : ""))
        )
      ))
    ),
    dailyTasks.length > 0 && h("div", { style: { marginBottom: 16 } },
      h("p", { style: { fontSize: 12, fontWeight: 600, color: theme.textMuted, textTransform: "uppercase", margin: "0 0 8px" } }, t("Täglich")),
      h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 8 } },
        dailyTasks.map((task) => {
          const assigneeId = householdCurrentAssignee(task.id, assignees, today);
          return h(HouseholdTaskCard, {
            key: task.id, theme, task, assigneeName: memberById(assigneeId)?.name || "",
            canToggle: canToggleFor(assigneeId), done: isDone(task.id, todayISO, assigneeId),
            onToggle: () => onToggleCompletion(task.id, todayISO, assigneeId, !isDone(task.id, todayISO, assigneeId)),
            canDelete: canEditOthers, onDelete: () => onDeleteTask(task.id),
          });
        })
      )
    ),
    h("div", { style: { overflowX: "auto" } },
      h("div", { style: { display: "grid", gridTemplateColumns: "repeat(7, minmax(120px, 1fr))", gap: 8, minWidth: 700 } },
        weekColumns.map((col) => h("div", { key: col.label + col.date, style: { display: "flex", flexDirection: "column", gap: 6 } },
          h("p", { style: { fontSize: 11, fontWeight: 700, textTransform: "uppercase", textAlign: "center", color: col.isToday ? theme.accent : theme.textMuted, margin: 0 } }, col.label),
          col.tasks.length === 0
            ? h("div", { style: { minHeight: 44, borderRadius: 10, border: `1px dashed ${theme.border}` } })
            : col.tasks.map((task) => {
                const assigneeId = householdCurrentAssignee(task.id, assignees, col.date);
                const dISO = isoDate(col.date);
                return h(HouseholdTaskCard, {
                  key: task.id, theme, task, assigneeName: memberById(assigneeId)?.name || "",
                  canToggle: canToggleFor(assigneeId) && col.isToday, done: isDone(task.id, dISO, assigneeId),
                  onToggle: () => onToggleCompletion(task.id, dISO, assigneeId, !isDone(task.id, dISO, assigneeId)),
                  canDelete: canEditOthers, onDelete: () => onDeleteTask(task.id),
                });
              })
        ))
      )
    )
  );
}

function CategorySelect({ theme, categories, value, onChange, onCreate, style }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");

  const handleChange = (e) => {
    if (e.target.value === "__neu__") { setAdding(true); return; }
    onChange(e.target.value);
  };

  const confirmNew = async () => {
    const name = newName.trim();
    if (!name) { setAdding(false); return; }
    const res = await onCreate(name);
    if (res?.ok !== false) onChange(name);
    setNewName(""); setAdding(false);
  };

  if (adding) {
    return h("div", { style: { display: "flex", gap: 4, ...style } },
      h("input", {
        value: newName, onChange: (e) => setNewName(e.target.value), autoFocus: true, placeholder: t("Neue Kategorie…"),
        onKeyDown: (e) => e.key === "Enter" && confirmNew(),
        style: { flex: 1, padding: "6px 8px", borderRadius: 6, border: `1px solid ${theme.accent}`, fontSize: 12, minWidth: 90 },
      }),
      h("button", { onClick: confirmNew, style: { fontSize: 11, color: theme.accentForeground, background: theme.accent, borderRadius: 6, padding: "0 8px", fontWeight: 600 } }, "OK"),
      h("button", { onClick: () => { setAdding(false); setNewName(""); }, style: { fontSize: 11, color: theme.textMuted, background: "none" } }, "×")
    );
  }

  return h("select", { value, onChange: handleChange, style: { backgroundColor: theme.surface, color: theme.text, padding: "6px 8px", borderRadius: 6, border: `1px solid ${theme.border}`, fontSize: 11, ...style } },
    categories.map((k) => h("option", { key: k.name || k, value: k.name || k }, k.name || k)),
    h("option", { value: "__neu__" }, t("+ Neue Kategorie…"))
  );
}

function CategoryManagerPanel({ theme, categories, entries, onCreate, onRename, onDelete, onUpdateBudget, onClose }) {
  const [newName, setNewName] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [deletingId, setDeletingId] = useState(null);
  const [transferTarget, setTransferTarget] = useState("");
  const [budgetDrafts, setBudgetDrafts] = useState({});

  const countFor = (name) => entries.filter((e) => e.kategorie === name).length;

  const submitBudget = (cat) => {
    const raw = budgetDrafts[cat.id];
    if (raw === undefined) return;
    const trimmed = raw.trim();
    const value = trimmed === "" ? null : parseFloat(trimmed.replace(",", "."));
    onUpdateBudget(cat.id, Number.isFinite(value) ? value : null);
    setBudgetDrafts((d) => { const next = { ...d }; delete next[cat.id]; return next; });
  };

  const submitNew = async () => {
    const name = newName.trim();
    if (!name) return;
    await onCreate(name);
    setNewName("");
  };

  const submitRename = async (cat) => {
    const name = editName.trim();
    if (!name || name === cat.name) { setEditingId(null); return; }
    await onRename(cat.id, cat.name, name);
    setEditingId(null);
  };

  const confirmDelete = async (cat) => {
    const count = countFor(cat.name);
    await onDelete(cat.id, cat.name, count > 0 ? transferTarget : null);
    setDeletingId(null); setTransferTarget("");

  const fallbackKategorie = financeCategories[financeCategories.length - 1]?.name || t("Sonstiges");

  const suggestKategorie = (empfaenger) => {
    if (!empfaenger) return fallbackKategorie;
    const key = empfaenger.toLowerCase().trim();
    const match = payeeCategories.find((p) => key.includes(p.zahlungsempfaenger) || p.zahlungsempfaenger.includes(key));
    return match ? match.kategorie : fallbackKategorie;
  };

  const isDuplicate = (datum, betrag) => entries.some((e) => e.datum === datum && Math.abs(Number(e.betrag) - betrag) < 0.005);

  const handleFile = async (file) => {
    if (!file) return;
    const text = await file.text();
    const { headers, rows: rawRows } = parseBankCSV(text);
    if (headers.length === 0) { setRows([]); return; }

    const datumIdx = guessColumn(headers, ["buchungstag", "buchungsdatum", "datum", "wertstellung", "date"]);
    const betragIdx = guessColumn(headers, ["betrag", "umsatz", "amount"]);
    const empfaengerIdx = guessColumn(headers, ["zahlungsempfänger", "zahlungsempfaenger", "beguenstigter", "begünstigter", "auftraggeber", "name", "verwendungszweck", "buchungstext"]);
    const zahlerIdx = guessColumn(headers, ["zahlungspflichtige", "auftraggeber"]);
    const umsatztypIdx = guessColumn(headers, ["umsatztyp", "buchungstyp", "soll/haben", "cd-kennzeichen"]);

    const parsed = rawRows.map((r, i) => {
      const datum = datumIdx !== -1 ? parseFlexibleDate(r[datumIdx]) : null;
      const betrag = betragIdx !== -1 ? parseGermanNumber(r[betragIdx]) : NaN;
      // Bei eingehenden Zahlungen steht der eigentliche Absender in der
      // t("Zahlungspflichtige*r")-Spalte, nicht in t("Zahlungsempfänger*in")
      // (die zeigt dann nur den eigenen Namen). Fällt Umsatztyp/Betrag
      // nicht eindeutig aus, wird die Empfänger-Spalte als Rückfalloption
      // genutzt.
      const istEingang = umsatztypIdx !== -1 ? /eingang/i.test(r[umsatztypIdx]) : betrag > 0;
      const empfaenger = (istEingang && zahlerIdx !== -1 && r[zahlerIdx]) ? r[zahlerIdx] : (empfaengerIdx !== -1 ? r[empfaengerIdx] : "");
      const valid = datum && !isNaN(betrag);
      const existingDuplicate = valid && isDuplicate(datum, betrag);
      // auch innerhalb derselben Datei prüfen (z.B. Datei versehentlich zweimal
      // hochgeladen oder doppelte Zeile enthalten)
      const withinFileDuplicate = valid && rawRows.slice(0, i).some((prevRow) => {
        const prevDatum = datumIdx !== -1 ? parseFlexibleDate(prevRow[datumIdx]) : null;
        const prevBetrag = betragIdx !== -1 ? parseGermanNumber(prevRow[betragIdx]) : NaN;
        return prevDatum === datum && !isNaN(prevBetrag) && Math.abs(prevBetrag - betrag) < 0.005;
      });
      const duplicate = existingDuplicate || withinFileDuplicate;
      return {
        key: i, datum, betrag, zahlungsempfaenger: empfaenger,
        kategorie: valid ? suggestKategorie(empfaenger) : fallbackKategorie,
        duplicate,
        included: valid && !duplicate,
        valid,
      };
    });
    setRows(parsed);
  };

  const toggleIncluded = (key) => setRows((rs) => rs.map((r) => (r.key === key ? { ...r, included: !r.included } : r)));
  const changeKategorie = (key, kategorie) => setRows((rs) => rs.map((r) => (r.key === key ? { ...r, kategorie } : r)));

  const confirmImport = async () => {
    setBusy(true);
    const toImport = rows.filter((r) => r.included && r.valid);
    await onImport(toImport);
    setBusy(false);
    onClose();
  };

  const validCount = rows?.filter((r) => r.valid).length ?? 0;
  const includedCount = rows?.filter((r) => r.included).length ?? 0;
  const duplicateCount = rows?.filter((r) => r.duplicate).length ?? 0;

  return h("div", { style: { marginBottom: 20, borderRadius: 16, border: `1px solid ${theme.border}`, backgroundColor: theme.surface, padding: 16 } },
    h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 } },
      h("p", { style: { fontSize: 13, fontWeight: 600, color: theme.text, margin: 0 } }, "CSV-Import"),
      h("button", { onClick: onClose, style: { color: theme.textMuted, background: "none" } }, React.createElement(X, { size: 14 }))
    ),
    rows === null && h("div", null,
      h("input", { ref: fileInput, type: "file", accept: ".csv,text/csv", style: { display: "none" }, onChange: (e) => handleFile(e.target.files[0]) }),
      h("button", { onClick: () => fileInput.current?.click(), style: { padding: "8px 16px", borderRadius: 8, backgroundColor: theme.surfaceAlt, color: theme.text, fontSize: 13, fontWeight: 500 } }, t("CSV-Datei auswählen")),
      h("p", { style: { fontSize: 12, color: theme.textMuted, marginTop: 8 } }, t("Spalten (Datum/Betrag/Empfänger) werden automatisch erkannt, Kategorien nach früheren Zuordnungen vorgeschlagen."))
    ),
    rows !== null && rows.length === 0 && h("p", { style: { fontSize: 13, color: theme.textMuted } }, t("Konnte die Datei nicht lesen — bitte prüfen, ob es eine gültige CSV-Datei ist.")),
    rows && rows.length > 0 && h("div", null,
      h("p", { style: { fontSize: 12, color: theme.textMuted, marginBottom: 10 } },
        tf("{n} Zeilen erkannt{dup}. {included} zum Import ausgewählt.", {
          n: validCount,
          dup: duplicateCount > 0 ? tf(", {n} davon vermutlich schon vorhanden (vorab abgewählt)", { n: duplicateCount }) : "",
          included: includedCount,
        })
      ),
      h("div", { style: { maxHeight: 340, overflowY: "auto", display: "flex", flexDirection: "column", gap: 6 } },
        rows.map((r) => h("div", {
          key: r.key,
          style: { display: "grid", gridTemplateColumns: "20px 90px 70px 1fr 130px", gap: 8, alignItems: "center", padding: "6px 8px", borderRadius: 8, backgroundColor: r.duplicate ? hexA(theme.eventCoral, 0.08) : theme.surfaceAlt + "80", opacity: r.valid ? 1 : 0.4 },
        },
          h("input", { type: "checkbox", checked: r.included, disabled: !r.valid, onChange: () => toggleIncluded(r.key) }),
          h("span", { style: { fontSize: 11, color: theme.textMuted, fontVariantNumeric: "tabular-nums" } }, r.datum || "?"),
          h("span", { style: { fontSize: 12, fontWeight: 600, color: r.betrag > 0 ? theme.eventGreen : theme.text, fontVariantNumeric: "tabular-nums" } }, isNaN(r.betrag) ? "?" : `${r.betrag > 0 ? "+" : ""}${r.betrag.toFixed(2)}`),
          h("span", { style: { fontSize: 12, color: theme.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, r.zahlungsempfaenger || "—", r.duplicate && h("span", { style: { color: theme.eventCoral, fontSize: 10, marginLeft: 6 } }, "bereits vorhanden")),
          h(CategorySelect, { theme, categories: financeCategories, value: r.kategorie, onChange: (v) => changeKategorie(r.key, v), onCreate: onCreateCategory })
        ))
      ),
      h("div", { style: { display: "flex", gap: 8, marginTop: 14 } },
        h("button", { onClick: () => setRows(null), style: { padding: "8px 14px", borderRadius: 8, backgroundColor: theme.surfaceAlt, color: theme.text, fontSize: 13 } }, t("Andere Datei")),
        h("button", { onClick: confirmImport, disabled: busy || includedCount === 0, style: { padding: "8px 16px", borderRadius: 8, backgroundColor: theme.accent, color: theme.accentForeground, fontSize: 13, fontWeight: 600, opacity: busy || includedCount === 0 ? 0.6 : 1 } }, busy ? t("Importiert…") : tf("{n} Buchungen importieren", { n: includedCount }))
      )
    )
  );
}

// ── Assistent v1 (regelbasiert) ────────────────────────────────────
// Bewusste Vereinfachung fürs MVP: Vorschläge werden bei jedem Aufruf frisch
// berechnet, t("Ignorieren") gilt nur für die aktuelle Sitzung (kein
// Persistieren in assistant_suggestions) — reicht für v1, siehe Plan.
function computeSuggestions({ events, tasks, reminders, members, activeMember, shoppingItems, financeEntries, documents, exams, mealPlan, upcomingBirthdays }) {
  const out = [];
  const now = new Date();
  const todayStr = isoDate(now);
  const in3Days = addDays(now, 3);
  const in7Days = addDays(now, 7);
  const in14Days = addDays(now, 14);

  const timed = events
    .filter((e) => !e.ganztaegig && !e.geloescht)
    .map((e) => ({ ...e, start: new Date(e.start_zeit), end: new Date(e.end_zeit) }))
    .filter((e) => e.start < in14Days && e.end > now)
    .sort((a, b) => a.start - b.start);

  // ── Terminüberschneidungen ────────────────────────────────
  for (let i = 0; i < timed.length; i++) {
    for (let j = i + 1; j < timed.length; j++) {
      if (overlaps(timed[i], timed[j])) {
        out.push({ key: `konflikt-${timed[i].id}-${timed[j].id}`, prio: 1, icon: "⚠️", cat: t("Kalender"),
          text: tf('\'{a}" und \'{b}" überschneiden sich am {date}.', { a: timed[i].titel, b: timed[j].titel, date: timed[i].start.toLocaleDateString(locale()) }),
        });
      }
    }
  }

  // ── Freie Zeitfenster ─────────────────────────────────────
  for (let d = 0; d < 7; d++) {
    const day = addDays(now, d);
    const dayEvents = timed.filter((e) => sameDay(e.start, day)).sort((a, b) => a.start - b.start);
    const dayStart = new Date(day); dayStart.setHours(9, 0, 0, 0);
    const dayEnd = new Date(day); dayEnd.setHours(20, 0, 0, 0);
    let cursor = d === 0 ? new Date(Math.max(dayStart, now)) : dayStart;
    for (const e of [...dayEvents, { start: dayEnd, end: dayEnd }]) {
      const gapHours = (e.start - cursor) / 36e5;
      if (gapHours >= 3) {
        out.push({ key: `frei-${isoDate(day)}-${cursor.getHours()}`, prio: 5, icon: "🕐", cat: t("Freizeit"),
          text: tf("Freies Zeitfenster am {tag}, {datum}: {von}–{bis} Uhr.", {
            tag: WOCHENTAGE[(day.getDay() + 6) % 7],
            datum: `${day.getDate()}.${day.getMonth() + 1}.`,
            von: fmtTime(cursor), bis: fmtTime(e.start),
          }),
        });
        break;
      }
      cursor = e.end > cursor ? e.end : cursor;
    }
  }

  // ── Fällige Aufgaben/Erinnerungen ─────────────────────────
  const overdueTasks = tasks.filter((t) => t.status === "offen" && t.frist && t.frist < todayStr && !t.geloescht);
  if (overdueTasks.length > 0) {
    out.push({ key: "ueberfaellige-aufgaben", prio: 1, icon: "🔴", cat: t("Aufgaben"),
      text: tf("{n} überfällige Aufgabe{s}: {list}{more}.", {
        n: overdueTasks.length,
        s: overdueTasks.length > 1 ? "n" : "",
        en_s: overdueTasks.length === 1 ? "" : "s",
        list: overdueTasks.slice(0, 3).map((t) => t.titel).join(", "),
        more: overdueTasks.length > 3 ? " ..." : "",
      }),
    });
  }
  const soonTasks = tasks.filter((t) => t.status === "offen" && t.frist && t.frist >= todayStr && t.frist <= isoDate(in3Days) && !t.geloescht);
  soonTasks.forEach((tk) => out.push({ key: `frist-task-${tk.id}`, prio: 2, icon: "📋", cat: t("Aufgaben"),
    text: tf('\'{titel}" ist fällig am {date}.', { titel: tk.titel, date: new Date(tk.frist).toLocaleDateString(locale()) }),
  }));
  const overdueReminders = reminders.filter((r) => r.status === "offen" && r.faelligkeit && r.faelligkeit < todayStr);
  if (overdueReminders.length > 0) {
    out.push({ key: "ueberfaellige-erinnerungen", prio: 1, icon: "🔔", cat: t("Erinnerungen"),
      text: tf("{n} überfällige Erinnerung{s}: {list}.", {
        n: overdueReminders.length,
        s: overdueReminders.length > 1 ? "en" : "",
        en_s: overdueReminders.length === 1 ? "" : "s",
        list: overdueReminders.slice(0, 3).map((r) => r.titel).join(", "),
      }),
    });
  }
  const soonReminders = reminders.filter((r) => r.status === "offen" && r.faelligkeit && r.faelligkeit >= todayStr && r.faelligkeit <= isoDate(in3Days));
  soonReminders.forEach((r) => out.push({ key: `frist-rem-${r.id}`, prio: 2, icon: "🔔", cat: t("Erinnerungen"),
    text: tf('\'{titel}" ist fällig am {date}.', { titel: r.titel, date: new Date(r.faelligkeit).toLocaleDateString(locale()) }),
  }));

  // ── Geburtstage ───────────────────────────────────────────
  (upcomingBirthdays || []).forEach((b) => {
    const daysUntil = Math.round((b.next - now) / 864e5);
    if (daysUntil <= 7) {
      out.push({ key: `geb-${b.id}`, prio: daysUntil === 0 ? 1 : 2, icon: "🎂", cat: t("Geburtstage"),
        text: daysUntil === 0
          ? tf("Heute hat {name} Geburtstag!", { name: b.name })
          : tf("{name} hat in {n} Tag{s} Geburtstag ({date}).", {
              name: b.name, n: daysUntil, s: daysUntil > 1 ? "en" : "", en_s: daysUntil === 1 ? "" : "s",
              date: b.next.toLocaleDateString(locale(), { day: "numeric", month: "long" }),
            }),
      });
    }
  });

  // ── Einkauf ───────────────────────────────────────────────
  const offeneItems = (shoppingItems || []).filter((i) => !i.erledigt);
  if (offeneItems.length >= 5) {
    out.push({ key: "einkauf-voll", prio: 4, icon: "🛒", cat: t("Einkauf"),
      text: tf("{n} offene Artikel auf der Einkaufsliste — Zeit zum Einkaufen?", { n: offeneItems.length }),
    });
  }

  // ── Finanzen ──────────────────────────────────────────────
  if (financeEntries && financeEntries.length > 0) {
    const thisMonth = financeEntries.filter((e) => e.datum?.slice(0, 7) === todayStr.slice(0, 7));
    const einnahmen = thisMonth.filter((e) => Number(e.betrag) > 0).reduce((s, e) => s + Number(e.betrag), 0);
    const ausgaben = thisMonth.filter((e) => Number(e.betrag) < 0).reduce((s, e) => s + Math.abs(Number(e.betrag)), 0);
    if (ausgaben > einnahmen && einnahmen > 0) {
      out.push({ key: "finanzen-negativ", prio: 2, icon: "💰", cat: t("Finanzen"),
        text: tf("Ausgaben ({ausgaben} €) übersteigen die Einnahmen ({einnahmen} €) diesen Monat.", { ausgaben: ausgaben.toFixed(0), einnahmen: einnahmen.toFixed(0) }),
      });
    }
    // Top-Kategorie
    const byCat = {};
    thisMonth.filter((e) => Number(e.betrag) < 0).forEach((e) => { byCat[e.kategorie] = (byCat[e.kategorie] || 0) + Math.abs(Number(e.betrag)); });
    const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    if (topCat && topCat[1] > 100) {
      out.push({ key: "finanzen-top-kat", prio: 5, icon: "📊", cat: t("Finanzen"),
        text: tf("Größter Ausgabenposten diesen Monat: {kat} mit {betrag} €.", { kat: topCat[0], betrag: topCat[1].toFixed(0) }),
      });
    }
  }

  // ── Dokumente ─────────────────────────────────────────────
  const neueDokumente = (documents || []).filter((d) => d.status === "neu");
  if (neueDokumente.length > 0) {
    out.push({ key: "doku-neu", prio: 3, icon: "📄", cat: t("Dokumente"),
      text: tf("{n} neue{a} Dokument{e} warte{v} auf Prüfung.", {
        n: neueDokumente.length,
        a: neueDokumente.length > 1 ? "" : "s",
        e: neueDokumente.length > 1 ? "e" : "",
        v: neueDokumente.length > 1 ? "n" : "t",
        // Nur von der englischen Vorlage genutzt, da "is/are" und
        // "document(s)" sich nicht mit denselben Suffixen bilden lassen.
        en_s: neueDokumente.length === 1 ? "" : "s",
        en_isare: neueDokumente.length === 1 ? "is" : "are",
      }),
    });
  }

  // ── Schule / Klassenarbeiten ──────────────────────────────
  const soonExams = (exams || []).filter((e) => e.datum >= todayStr && e.datum <= isoDate(in7Days));
  soonExams.forEach((e) => {
    const child = members.find((m) => m.id === e.member_id);
    out.push({ key: `exam-${e.id}`, prio: 2, icon: "📝", cat: t("Schule"),
      text: tf("Klassenarbeit{titel} am {datum}{kind}.", {
        titel: e.titel ? " " + e.titel : "", datum: new Date(e.datum).toLocaleDateString(locale()),
        kind: child ? " (" + child.name + ")" : "",
      }),
    });
  });

  // ── Essensplan ────────────────────────────────────────────
  if (mealPlan) {
    const tomorrow = isoDate(addDays(now, 1));
    const tomorrowMeals = mealPlan.filter((m) => m.datum === tomorrow);
    if (tomorrowMeals.length === 0) {
      out.push({ key: "essensplan-morgen", prio: 4, icon: "🍽️", cat: t("Essensplan"),
        text: t("Für morgen ist noch kein Essen geplant."),
      });
    }
  }

  // ── Aufgaben-Statistik pro Person ─────────────────────────
  const openTasksByMember = {};
  tasks.filter((t) => t.status === "offen" && !t.geloescht && t.member_id).forEach((t) => { openTasksByMember[t.member_id] = (openTasksByMember[t.member_id] || 0) + 1; });
  const maxTasks = Math.max(...Object.values(openTasksByMember), 0);
  if (maxTasks >= 5) {
    const busyMember = members.find((m) => openTasksByMember[m.id] === maxTasks);
    if (busyMember) {
      out.push({ key: "viel-todo", prio: 4, icon: "📌", cat: t("Aufgaben"),
        text: tf("{name} hat {n} offene Aufgaben — Unterstützung nötig?", { name: busyMember.name, n: maxTasks }),
      });
    }
  }

  // ── Morgen-Briefing (ab 6 Uhr, nur heute) ─────────────────
  if (now.getHours() >= 6 && now.getHours() < 10) {
    const todayEvents = events.filter((e) => !e.geloescht && e.start_zeit?.slice(0, 10) === todayStr);
    const todayTasks = tasks.filter((t) => t.status === "offen" && t.frist === todayStr && !t.geloescht);
    if (todayEvents.length > 0 || todayTasks.length > 0) {
      out.push({ key: "morgen-briefing", prio: 3, icon: "☀️", cat: t("Tagesstart"),
        text: tf("Heute: {n} Termin{s}{tasks}.", {
          n: todayEvents.length, s: todayEvents.length !== 1 ? "e" : "", en_s: todayEvents.length !== 1 ? "s" : "",
          tasks: todayTasks.length > 0 ? tf(", {n} fällige Aufgabe{s}", { n: todayTasks.length, s: todayTasks.length !== 1 ? "n" : "", en_s: todayTasks.length !== 1 ? "s" : "" }) : "",
        }),
      });
    }
  }

  // Nach Priorität sortieren (1 = dringendst)
  out.sort((a, b) => a.prio - b.prio);
  return out;
}

  const [importBusy, setImportBusy] = useState(false);
  const importFileInput = useRef(null);
  const [section, setSection] = useState("profil");
  const [showAddMember, setShowAddMember] = useState(false);

  const visibleSections = settingsSections().filter((s) => s.always || canView(s.bereich));
  useEffect(() => { if (!visibleSections.find((s) => s.id === section)) setSection("profil"); }, [visibleSections, section]);

  const runSync = async () => {
    setSyncBusy(true);
    const res = await onSyncCaldav();
    const text = res.ok ? tf("Erledigt: {neu} neu, {akt} aktualisiert{del}{err} (Kalender \"{kal}\"{found}). {diag}{lastErr}{lastInsertErr}", {
      neu: res.neu, akt: res.aktualisiert, kal: res.kalender,
      del: res.geloescht ? tf(", {n} gelöscht", { n: res.geloescht }) : "",
      err: res.fehlerhaft ? tf(", {n} fehlerhaft", { n: res.fehlerhaft }) : "",
      found: res.alle_kalender?.length > 1 ? tf(", gefunden: {list}", { list: res.alle_kalender.join(", ") }) : "",
      // diagnose/letzterFehler kommen als Rohtext von der Edge Function — unuebersetzt durchreichen.
      diag: res.diagnose || "",
      lastErr: res.letzterFehler ? " " + res.letzterFehler : "",
      lastInsertErr: res.letzterInsertFehler ? tf(" Insert-Fehler: {msg}", { msg: res.letzterInsertFehler }) : "",
    }) : (res.error || t("Fehler."));
    showToast(text, res.ok ? "success" : "error", 8000);
    setSyncBusy(false);
  };
  const runExport = async () => {
    setExportBusy(true);
    await onExportData();
    showToast(t("Export gestartet — die Datei wird heruntergeladen."));
    setExportBusy(false);
  };
  const runImport = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let dump;
      try { dump = JSON.parse(reader.result); }
      catch { showToast(t("Diese Datei ist kein gültiges Backup."), "error"); return; }
      requestConfirm(
        t("Bestehende Einträge mit gleicher ID werden dabei auf den Stand des Backups zurückgesetzt. Das lässt sich nicht rückgängig machen. Fortfahren?"),
        async () => {
          setImportBusy(true);
          const errors = await onImportData(dump);
          setImportBusy(false);
          showToast(
            errors.length === 0 ? t("Backup wiederhergestellt.") : tf("Wiederhergestellt, aber mit Fehlern: {errors}", { errors: errors.join("; ") }),
            errors.length === 0 ? "success" : "error",
            errors.length === 0 ? 3800 : 8000
          );
        },
        { confirmLabel: t("Wiederherstellen") }
      );
    };
    reader.readAsText(file);
  };

  return h("div", { style: { maxWidth: 720, margin: "0 auto", width: "100%" } },
    h(PageHead, { theme, title: t("Einstellungen"), subtitle: t("Familienzentrale anpassen.") }),
    h("div", { style: { marginBottom: 20, display: "flex", gap: 4, flexWrap: "wrap", borderRadius: 10, border: `1px solid ${theme.border}`, backgroundColor: theme.surface, padding: 3, width: "fit-content" } },
      visibleSections.map((s) => h("button", {
        key: s.id, onClick: () => setSection(s.id),
        style: { borderRadius: 8, padding: "7px 14px", fontSize: 13, fontWeight: 500, backgroundColor: section === s.id ? theme.accent : "transparent", color: section === s.id ? theme.accentForeground : theme.textMuted },
      }, s.label))
    ),

    section === "profil" && h(MyProfileSection, { theme, activeMember, onUpdateAvatar, onChangePassword, onUpdateProfile }),

    section === "mein_bereich" && h(MyDashboardSection, { theme, isWidgetEnabled, onUpdate: onUpdateDashboardPreference }),

    section === "allgemein" && h("div", { style: { display: "flex", flexDirection: "column", gap: 24 } },
      h("div", { style: { backgroundColor: theme.surface, border: `1px solid ${theme.border}`, borderRadius: 14, overflow: "hidden" } },
        h("div", { style: { padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 } },
          h("span", { style: { fontSize: 15, color: theme.text } }, t("Darstellung")),
          h("div", { style: { display: "flex", borderRadius: 10, border: `1px solid ${theme.border}`, padding: 3, width: "fit-content" } },
            [["dunkel", t("Dunkel"), Moon], ["hell", t("Hell"), Sun]].map(([id, label, Icon]) => h("button", {
              key: id, onClick: () => onSetTheme(id),
              style: { display: "flex", alignItems: "center", gap: 6, borderRadius: 8, padding: "7px 14px", fontSize: 13, fontWeight: 500, backgroundColor: themeName === id ? theme.accent : "transparent", color: themeName === id ? theme.accentForeground : theme.textMuted },
            }, React.createElement(Icon, { size: 14 }), label))
          )
        ),
        h("div", { style: { borderTop: `1px solid ${theme.border}`, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 } },
          h("span", { style: { fontSize: 15, color: theme.text } }, t("Sprache")),
          h("div", { style: { display: "flex", borderRadius: 10, border: `1px solid ${theme.border}`, padding: 3, width: "fit-content" } },
            Object.entries(SPRACHEN).map(([id, s]) => h("button", {
              key: id, onClick: () => onSetLang(id),
              style: { display: "flex", alignItems: "center", gap: 6, borderRadius: 8, padding: "7px 14px", fontSize: 13, fontWeight: 500, backgroundColor: langName === id ? theme.accent : "transparent", color: langName === id ? theme.accentForeground : theme.textMuted },
            }, s.label))
          )
        )
      ),
      h(NotificationsSection, { theme, onEnablePush, onSendTestPush, notificationPreferences, onUpdatePreference: onUpdateNotificationPreference }),
      h("div", { style: { backgroundColor: theme.surface, border: `1px solid ${theme.border}`, borderRadius: 14, overflow: "hidden" } },
        h("div", { style: { padding: "14px 16px" } },
          h("p", { style: { fontSize: 12, color: theme.textMuted, margin: "0 0 10px" } }, t("Angemeldet als ") + activeMember.name + (activeMember.ist_master ? " (Master)" : "") + t(". Jede Person hat einen eigenen Zugang mit eigenen Rechten.")),
          h("button", { onClick: signOut, style: { fontSize: 15, fontWeight: 500, color: theme.destructive, background: "none" } }, t("Abmelden"))
        ),
        h("div", { style: { borderTop: `1px solid ${theme.border}`, padding: "14px 16px" } },
          h("p", { style: { fontSize: 12, color: theme.textMuted, margin: "0 0 10px" } }, t("Lädt alle Familiendaten als Datei herunter (Termine, Aufgaben, Dokumente-Liste usw. — die Dateien selbst, z. B. gescannte Dokumente, sind nicht enthalten).")),
          h("button", { onClick: runExport, disabled: exportBusy, style: { fontSize: 15, fontWeight: 500, color: theme.accent, background: "none" } }, exportBusy ? t("Exportiert…") : t("Daten exportieren"))
        ),
        h("div", { style: { borderTop: `1px solid ${theme.border}`, padding: "14px 16px" } },
          h("p", { style: { fontSize: 12, color: theme.textMuted, margin: "0 0 10px" } }, t("Stellt eine zuvor exportierte Backup-Datei wieder her. Vorsicht: überschreibt bestehende Einträge mit gleicher ID.")),
          h("input", { ref: importFileInput, type: "file", accept: "application/json", style: { display: "none" }, onChange: (e) => { runImport(e.target.files[0]); e.target.value = ""; } }),
          h("button", { onClick: () => importFileInput.current?.click(), disabled: importBusy, style: { fontSize: 15, fontWeight: 500, color: theme.accent, background: "none" } }, importBusy ? t("Stellt wieder her…") : t("Backup importieren"))
        )
      )
    ),

    section === "rechte" && h(MemberPermissionsMatrix, { theme, members, rolePermissions, memberPermissions, onUpdate: onUpdateMemberPermission, onReset: onResetMemberPermission }),

    section === "personen" && h(React.Fragment, null,
      h("div", { style: { display: "flex", alignItems: "center", justifyContent: "flex-end", marginBottom: 12 } },
        h(AddButton, { theme, label: t("Person"), onClick: () => setShowAddMember(true) })
      ),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
        members.map((m) => h(PersonRow, { key: m.id, theme, member: m, isSelf: m.id === activeMember.id, onDelete: onDeleteMember, onResetPassword: onResetPassword }))
      ),
      showAddMember && h(Modal, { theme, title: t("Person hinzufügen"), onClose: () => setShowAddMember(false) },
        h(AddMemberForm, { theme, onAdd: async (fields, file) => { const res = await onAddMember(fields, file); if (!res || !res.error) setShowAddMember(false); return res; } })
      )
    ),

    section === "verbindungen" && h("div", { style: { backgroundColor: theme.surface, border: `1px solid ${theme.border}`, borderRadius: 16, padding: 16 } },
      h("p", { style: { fontSize: 13, fontWeight: 600, color: theme.text, margin: "0 0 8px" } }, t("Apple-Kalender-Sync")),
      h("p", { style: { fontSize: 12, color: theme.textMuted, margin: "0 0 10px" } }, t("Holt Termine aus dem gemeinsamen Apple-Kalender — erst nutzbar, wenn die caldav-sync-Function deployed und mit Apple-Zugangsdaten (Secrets) versehen ist.")),
      h("button", { onClick: runSync, disabled: syncBusy, style: { padding: "8px 16px", borderRadius: 8, backgroundColor: theme.accent, color: theme.accentForeground, fontSize: 13, fontWeight: 600 } }, syncBusy ? t("Synchronisiert…") : t("Jetzt synchronisieren"))
    )
  );
}

function OverviewModule({
  theme, activeMember, members, tasks, reminders, events, shoppingItems, documents, upcomingBirthdays,
  votes, isPhone, setActiveTab, suggestions, ignoredSuggestions, ignoreSuggestion, personalOnly, isWidgetEnabled,
  householdTasks, householdAssignees, householdCompletions,
}) {
  const show = (widget) => !personalOnly || isWidgetEnabled(widget);
  const isMine = (e) => e.member_id === activeMember.id || (e.member_ids || []).includes(activeMember.id);
  const myTasks = personalOnly ? tasks.filter((t) => t.member_id === activeMember.id) : tasks;
  const myEventsToday = (personalOnly ? events.filter(isMine) : events)
    .filter((e) => !e.geloescht && e.start_zeit?.slice(0, 10) === isoDate(new Date()));

  return h("div", { style: { maxWidth: 1152, margin: "0 auto", width: "100%", display: "flex", flexDirection: "column", gap: 24 } },
    h("div", null,
      h("h2", { style: { fontSize: 26, fontWeight: 700, color: theme.text, margin: 0, letterSpacing: "-0.01em" } }, `${greetingWord()}, ${activeMember.name}`),
      h("p", { style: { fontSize: 14, color: theme.textMuted, margin: "4px 0 0", textTransform: "capitalize" } }, new Date().toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" }))
    ),
    show("kennzahlen") && h(StatTiles, {
      theme, onNavigate: setActiveTab,
      stats: {
        aufgaben: myTasks.filter((t) => t.status === "offen").length,
        erinnerungen: reminders.filter((r) => r.status === "offen").length,
        kalender: myEventsToday.length,
        einkauf: shoppingItems.filter((i) => !i.erledigt).length,
      },
    }),
    (show("heutige_termine") || show("assistent")) && h("div", { style: { display: "grid", gridTemplateColumns: isPhone ? "1fr" : "3fr 2fr", gap: 20 } },
      show("heutige_termine") && h(TodayAppointments, {
        theme, members, onNavigate: setActiveTab,
        appointments: (personalOnly ? events.filter(isMine) : events)
          .filter((e) => !e.geloescht && !(activeMember.rolle === "kind" && e.ist_privat) && e.start_zeit?.slice(0, 10) === isoDate(new Date()))
          .map((e) => ({ ...e, start: new Date(e.start_zeit) }))
          .sort((a, b) => a.start - b.start),
      }),
      show("assistent") && h(AssistantCard, { theme, suggestions: suggestions.slice(0, 3), ignored: ignoredSuggestions, onIgnore: ignoreSuggestion })
    ),
    personalOnly && show("termine_woche") && h(TodayAppointments, {
      theme, members, onNavigate: setActiveTab,
      title: t("Meine Termine diese Woche"), emptyLabel: t("Diese Woche keine weiteren Termine."), showDate: true,
      appointments: events.filter(isMine)
        .filter((e) => {
          if (e.geloescht || (activeMember.rolle === "kind" && e.ist_privat)) return false;
          const d = e.start_zeit?.slice(0, 10);
          const today = isoDate(new Date());
          const in7 = isoDate(addDays(new Date(), 7));
          return d && d > today && d <= in7;
        })
        .map((e) => ({ ...e, start: new Date(e.start_zeit) }))
        .sort((a, b) => a.start - b.start),
    }),
    (show("dokumente") || show("geburtstage") || show("erinnerungen_karte") || show("haushaltsplan_heute")) && h("div", { style: { display: "grid", gridTemplateColumns: isPhone ? "1fr" : "repeat(3, 1fr)", gap: 20 } },
      show("dokumente") && h(InfoCard, { theme, title: t("Dokumentenstatus"), icon: FileText, tone: theme.eventBlue, onNavigate: () => setActiveTab("dokumente"), navLabel: t("Ablage") },
        h("ul", { style: { display: "flex", flexDirection: "column", listStyle: "none", margin: 0, padding: 0 } },
          [
            { label: t("Neue Dokumente"), value: documents.filter((d) => d.status === "neu").length },
            { label: t("Geprüft"), value: documents.filter((d) => d.status === "geprueft").length },
          ].map((row, i) => h("li", { key: row.label, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: i > 0 ? `1px solid ${theme.border}99` : "none" } },
            h("span", { style: { fontSize: 13, color: theme.textMuted } }, row.label),
            h("span", { style: { fontSize: 17, fontWeight: 700, color: theme.accent, fontVariantNumeric: "tabular-nums" } }, row.value)
          ))
        )
      ),
      show("geburtstage") && h(InfoCard, { theme, title: t("Geburtstage"), icon: Cake, tone: theme.eventCoral },
        upcomingBirthdays.length === 0
          ? h("p", { style: { fontSize: 13, color: theme.textMuted, margin: 0 } }, t("Keine in den nächsten 30 Tagen."))
          : h("ul", { style: { display: "flex", flexDirection: "column", listStyle: "none", margin: 0, padding: 0 } },
              upcomingBirthdays.map((b, i) => h("li", { key: b.id, style: { display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderTop: i > 0 ? `1px solid ${theme.border}99` : "none" } },
                h("span", { style: { width: 34, height: 34, flexShrink: 0, borderRadius: 999, backgroundColor: theme.accent + "1A", color: theme.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 600 } }, b.name[0]),
                h("div", { style: { minWidth: 0, flex: 1 } }, h("p", { style: { fontSize: 14, fontWeight: 500, color: theme.text, margin: 0 } }, b.name)),
                h("span", { style: { fontSize: 12, color: theme.textMuted, fontVariantNumeric: "tabular-nums" } }, b.next.toLocaleDateString(locale(), { day: "numeric", month: "long" }))
              ))
            )
      ),
      show("erinnerungen_karte") && h(InfoCard, { theme, title: t("Erinnerungen"), icon: BellRing, tone: theme.eventAmber, onNavigate: () => setActiveTab("erinnerungen"), navLabel: t("Alle") },
        h("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
          h("span", { style: { fontSize: 34, fontWeight: 700, color: theme.text, fontVariantNumeric: "tabular-nums" } }, reminders.filter((r) => r.status === "offen").length),
          h("p", { style: { fontSize: 13, color: theme.textMuted, margin: 0, lineHeight: 1.5 } }, "offene Fristen")
        )
      ),
      show("haushaltsplan_heute") && (() => {
        const heute = new Date(); heute.setHours(0, 0, 0, 0);
        const heuteISO = isoDate(heute);
        const dueHeute = (householdTasks || []).filter((task) => householdIsDueOn(task, heute))
          .filter((task) => !personalOnly || householdCurrentAssignee(task.id, householdAssignees || [], heute) === activeMember.id);
        const erledigt = dueHeute.filter((task) => (householdCompletions || []).some((c) => c.task_id === task.id && c.datum === heuteISO
          && c.member_id === householdCurrentAssignee(task.id, householdAssignees || [], heute))).length;
        return h(InfoCard, { theme, title: t("Haushaltsplan"), icon: SprayCan, tone: theme.eventGreen, onNavigate: () => setActiveTab("haushaltsplan"), navLabel: t("Zum Haushaltsplan") },
          dueHeute.length === 0
            ? h("p", { style: { fontSize: 13, color: theme.textMuted, margin: 0 } }, t("Heute nichts zu tun."))
            : h("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
                h("span", { style: { fontSize: 34, fontWeight: 700, color: theme.text, fontVariantNumeric: "tabular-nums" } }, tf("{done}/{total}", { done: erledigt, total: dueHeute.length })),
                h("p", { style: { fontSize: 13, color: theme.textMuted, margin: 0, lineHeight: 1.5 } }, t("heute erledigt"))
              )
        );
      })()
    ),
    show("schnellaktionen") && h("section", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
      [
        { label: t("Termin anlegen"), icon: CalendarDays, tab: "kalender", action: "addEvent" },
        { label: t("Aufgabe anlegen"), icon: ListChecks, tab: "aufgaben", action: "addTask" },
        { label: t("Einkauf ergänzen"), icon: ShoppingCart, tab: "einkauf" },
        { label: t("Erinnerung anlegen"), icon: BellRing, tab: "erinnerungen" },
      ].map((a) => h("button", {
        key: a.label, onClick: () => setActiveTab(a.tab),
        style: { display: "flex", alignItems: "center", gap: 6, padding: "10px 16px", borderRadius: 12, border: `1px solid ${theme.border}`, backgroundColor: theme.surface, color: theme.text, fontSize: 13, fontWeight: 500 },
      },
        React.createElement(a.icon, { size: 15, color: theme.accent }),
        h("span", { className: "hidden sm:inline" }, a.label)
      ))
    ),
    show("kategorien") && h(CategoryTiles, {
      theme, onNavigate: setActiveTab,
      tiles: tileDefs().map((t) => ({
        ...t,
        badge: t.id === "voting" ? votes.filter((v) => v.status === "offen").length : 0,
      })),
    })
  );
}

function App() {
  const [themeName, setThemeName] = useState("dunkel");
  const theme = THEMES[themeName];
  const [langName, setLangName] = useState("de");
  // Muss VOR dem Rendern der Unterkomponenten wirken, damit t() dort schon
  // die richtige Sprache liefert — deshalb im Render-Rumpf, nicht im Effect.
  applyLang(langName);
  const viewportWidth = useViewportWidth();
  const isDesktop = viewportWidth >= 1024;
  const isTablet = viewportWidth >= 768 && viewportWidth < 1024;
  const isPhone = viewportWidth < 768;

  useEffect(() => {
    document.documentElement.style.backgroundColor = theme.sidebar;
    document.body.style.backgroundColor = theme.sidebar;
    document.documentElement.style.setProperty("--accent", theme.accent);
  }, [theme]);

  const [updateAvailable, setUpdateAvailable] = useState(!!window.__fzUpdateAvailable);
  useEffect(() => {
    const onUpdate = () => setUpdateAvailable(true);
    window.addEventListener("fz-update-available", onUpdate);
    return () => window.removeEventListener("fz-update-available", onUpdate);
  }, []);
  const [session, setSession] = useState(undefined); // undefined=lädt, null=abgemeldet, Objekt=angemeldet
  const [banner, setBanner] = useState(null);
  const [members, setMembers] = useState([]);
  const [membersLoading, setMembersLoading] = useState(true);
  const [activeTab, setActiveTab] = useState("mein_ueberblick");

  // Koppelt Reiter-Wechsel an den Browser-Verlauf, damit die native
  // Zurück-Wisch-Geste (Safari/iOS) zum vorherigen Reiter zurückspringt.
  useEffect(() => {
    window.history.replaceState({ tab: "mein_ueberblick" }, "", "#mein_ueberblick");
    const onPopState = (e) => { if (e.state?.tab) setActiveTab(e.state.tab); };
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);
  useEffect(() => {
    if (window.history.state?.tab !== activeTab) {
      window.history.pushState({ tab: activeTab }, "", "#" + activeTab);
    }
  }, [activeTab]);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  // Echter Login: jede Person meldet sich mit eigenem Zugang an (kein
  // gemeinsamer Familien-Login mehr). Supabase merkt sich die Sitzung
  // selbst (localStorage) — kein tägliches Neu-Einloggen nötig, bis
  // t("Sperren")/t("Abmelden") aktiv ausgelöst wird.
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  const authReady = !!session;

  const loadMembers = useCallback(async () => {
    setMembersLoading(true);
    const { data, error } = await supabase.from("members").select("*").order("created_at");
    if (!error) setMembers(data || []);
    else setBanner(error.message);
    setMembersLoading(false);
  }, []);

  useEffect(() => { if (authReady) loadMembers(); }, [authReady, loadMembers]);

  const activeMember = useMemo(() => {
    if (!session) return null;
    return members.find((m) => m.user_id === session.user.id) || null;
  }, [members, session]);

  // Theme-Vorliebe der Person übernehmen, sobald ihr Profil geladen ist
  // (nur einmal pro Anmeldung, damit spätere manuelle Umschaltungen nicht
  // ständig überschrieben werden).
  const themeLoadedFor = useRef(null);
  useEffect(() => {
    if (activeMember && themeLoadedFor.current !== activeMember.id) {
      themeLoadedFor.current = activeMember.id;
      if (activeMember.theme_praeferenz) setThemeName(activeMember.theme_praeferenz);
      if (activeMember.sprache) setLangName(activeMember.sprache);
    }
  }, [activeMember]);

  const setThemeAndPersist = useCallback((name) => {
    setThemeName(name);
    if (activeMember) supabase.from("members").update({ theme_praeferenz: name }).eq("id", activeMember.id).then(() => {});
  }, [activeMember]);

  const setLangAndPersist = useCallback((name) => {
    setLangName(name);
    if (activeMember) supabase.from("members").update({ sprache: name }).eq("id", activeMember.id).then(() => {});
  }, [activeMember]);

  // Neue Personen entstehen ausschließlich über die manage-member Edge
  // Function (service_role) — nie per direktem Tabellen-Insert aus dem
  // Browser. Funktioniert sowohl für die allererste Einrichtung (ohne
  // Session) als auch danach (mit Master-Session im Authorization-Header).
  const createMember = useCallback(async (payload, avatarFile) => {
    let res, data;
    try {
      res = await fetch(`${SUPABASE_URL}/functions/v1/manage-member`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${session ? session.access_token : SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify(payload),
      });
      data = await res.json();
    } catch (err) {
      const msg = t("Konnte die Server-Funktion nicht erreichen: ") + err.message;
      setBanner(msg);
      return { ok: false, error: msg };
    }
    if (!res.ok) { setBanner(data.error || t("Anlegen fehlgeschlagen.")); return { ok: false, error: data.error }; }
    if (avatarFile && data.member) {
      const resized = await resizeImageFile(avatarFile, 400, 0.85);
      const path = `${data.member.id}/${crypto.randomUUID()}-${resized.name}`;
      const { error: upErr } = await supabase.storage.from("avatars").upload(path, resized);
      if (!upErr) await supabase.from("members").update({ avatar_pfad: path }).eq("id", data.member.id);
    }
    loadMembers();
    return { ok: true, member: data.member };
  }, [loadMembers, session]);

  const deleteMember = useCallback(async (id) => {
    const { error } = await supabase.from("members").delete().eq("id", id);
    if (error) setBanner(error.message);
    else loadMembers();

  const upcomingBirthdays = useMemo(() => {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    // Geburtstage aus Familienmitgliedern UND aus Kontakten zusammenführen
    const fromMembers = members.filter((m) => m.geburtstag).map((m) => ({ id: m.id, name: m.name, geburtstag: m.geburtstag, quelle: "mitglied" }));
    const fromContacts = contacts.filter((c) => c.geburtstag).map((c) => ({ id: c.id, name: c.name, geburtstag: c.geburtstag, quelle: "kontakt" }));
    return [...fromMembers, ...fromContacts]
      .map((p) => {
        const bd = new Date(p.geburtstag);
        let next = new Date(now.getFullYear(), bd.getMonth(), bd.getDate());
        if (next < now) next = new Date(now.getFullYear() + 1, bd.getMonth(), bd.getDate());
        const daysUntil = Math.round((next - now) / 86400000);
        return { ...p, next, daysUntil };
      })
      .filter((p) => p.daysUntil <= 30)
      .sort((a, b) => a.daysUntil - b.daysUntil);
  }, [members, contacts]);

// Catches rendering errors anywhere in the tree that would otherwise
// unmount the whole React tree (a blank page with no explanation — the
// exact symptom the broken service-worker cache caused). Shows a
// "reload" hint instead. Colours are deliberately hard-coded (no theme
// object available here, since the error may have happened somewhere
// below the theme context) — matches the app's default (dark theme) so
// it doesn't look like a style break.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error("Unexpected error:", error, info);
  }
  render() {
    if (!this.state.hasError) return this.props.children;
    return h("div", {
      style: {
        minHeight: "100vh", display: "flex", flexDirection: "column", gap: 14, alignItems: "center",
        justifyContent: "center", backgroundColor: "#000000", color: "#ffffff", padding: 24, textAlign: "center",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif",
      },
    },
      h("p", { style: { fontSize: 17, fontWeight: 600, margin: 0 } }, "Etwas ist schiefgelaufen."),
      h("p", { style: { fontSize: 14, color: "#98989d", margin: 0, maxWidth: 320 } }, "Bitte lade die Seite neu. Falls es weiter passiert, sag kurz Bescheid."),
      h("button", {
        onClick: () => window.location.reload(),
        style: { padding: "10px 20px", borderRadius: 10, backgroundColor: "#5ac8db", color: "#04211d", fontWeight: 600, fontSize: 14 },
      }, "Neu laden")
    );
  }
}

createRoot(document.getElementById("root")).render(h(ErrorBoundary, null, h(App)));

// Separate, standalone React root for toasts: runs outside the App tree
// so App re-renders/remounts (e.g. from realtime updates) can't reset the
// toast state mid-display.
const toastRootEl = document.createElement("div");
